version: "3.9"

services:
  weather:
    build: .
    image: weather-forecast:latest
    container_name: weather-forecast
    ports:
      - "8787:8000"
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - TZ=Asia/Shanghai
